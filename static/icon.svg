<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Freshflo app icon master. A messy voice line that settles into one clean stroke and a period: "Send it fresh." -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f4f9f7"/>
      <stop offset="1" stop-color="#e2efea"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".18" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="210" y1="0" x2="714" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3c2be"/>
      <stop offset=".3" stop-color="#7d9c95"/>
      <stop offset=".55" stop-color="#17a884"/>
      <stop offset="1" stop-color="#22c99b"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe6b9"/>
      <stop offset="1" stop-color="#0e9f79"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0e9f79" flood-opacity=".22"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#0c2421" stroke-opacity=".07" stroke-width="2"/>

  <g filter="url(#lift)">
    <path id="mark" d="M210 512 L248 404 L290 616 L332 446 L370 564 L400 498 C 424 444, 476 404, 514 458 C 550 506, 562 588, 612 588 C 654 588, 670 512, 714 512"
          fill="none" stroke="url(#ink)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="786" cy="512" r="31" fill="url(#dot)"/>
  </g>
</svg>
